name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: bash tests/test_module.sh
      - name: Build Magisk ZIP
        run: bash build.sh
      - name: Test ZIP
        run: |
          version="$(awk -F= '$1=="version" {print $2}' module/module.prop)"
          test -n "$version"
          unzip -t "dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
      - name: SHA256
        run: |
          version="$(awk -F= '$1=="version" {print $2}' module/module.prop)"
          sha256sum "dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Thermal-Refresh-Guard
          path: dist/HyperOS-Thermal-Refresh-Guard-v*.zip

