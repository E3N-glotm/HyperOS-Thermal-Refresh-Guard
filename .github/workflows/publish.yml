name: Publish Magisk Release

on:
  push:
    branches: [main]
    paths:
      - 'module/module.prop'
      - 'module/customize.sh'
      - 'module/post-fs-data.sh'
      - 'module/service.sh'
      - 'tests/test_module.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module and build installable ZIP
        run: |
          bash tests/test_module.sh
          bash build.sh
          version="$(sed -n 's/^version=//p' module/module.prop)"
          test -n "$version"
          unzip -t "dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
      - name: Create version tag and attach binary ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module/module.prop)"
          tag="v${version}"
          zip="dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite."
            exit 0
          fi
          checksum="$(sha256sum "$zip" | awk '{print $1}')"
          {
            echo "Capability-detected pudding display thermal FPS module, independent of Android/HyperOS build string."
            echo
            echo "Validated: cold-boot vendor thermal map bind, PowerKeeper thermal FPS setting gate, no framework 60-Hz thermal vote under observed conditions. Not guaranteed for all apps or thermal states."
            echo
            echo "Installer probes ThermalLevelMap XML, FPS property and PID1 mount. The OEM source fingerprint is pinned at install time and revalidated each boot; OTA XML changes require reinstall. CPU/GPU and battery thermal protections remain unchanged."
            echo
            echo "Magisk ZIP SHA256: \`$checksum\`"
          } > RELEASE_NOTES.md
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" "$zip" --title "HyperOS Thermal Refresh Guard $tag" --notes-file RELEASE_NOTES.md --prerelease
