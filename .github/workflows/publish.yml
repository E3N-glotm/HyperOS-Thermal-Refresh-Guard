name: Publish Magisk Release

on:
  push:
    branches: [main]
    paths:
      - 'module/module.prop'
      - 'module/customize.sh'
      - 'module/post-fs-data.sh'
      - 'module/service.sh'
      - 'module/action.sh'
      - 'module/bin/**'
      - 'tests/test_module.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module and build installable ZIP
        run: |
          bash tests/test_module.sh
          bash build.sh
          version="$(sed -n 's/^version=//p' module/module.prop)"
          test -n "$version"
          unzip -t "dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
      - name: Create version tag and attach binary ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module/module.prop)"
          tag="v${version}"
          zip="dist/HyperOS-Thermal-Refresh-Guard-v${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite."
            exit 0
          fi
          checksum="$(sha256sum "$zip" | awk '{print $1}')"
          {
            echo "v1.5.0 cross-device capability detection: no device/ROM allowlist. Installs without rejecting missing interfaces; incompatible devices report unsupported/partial in Magisk."
            echo
            echo "Existing pudding baseline validated the vendor thermal map and PowerKeeper route. Xiaomi 15 Pro (haotian) installation has only been simulated; no actual haotian ROM/thermal outcome claim."
            echo
            echo "Installer probes real vendor/odm/product ThermalLevelMap XML and PowerKeeper property, reports status, and attempts safe automatic regeneration after OTA XML updates. Unknown schemas or SELinux labels are skipped; CPU/GPU and battery thermal protections remain unchanged."
            echo
            echo "Magisk ZIP SHA256: \`$checksum\`"
          } > RELEASE_NOTES.md
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" "$zip" --title "HyperOS Thermal Refresh Guard $tag" --notes-file RELEASE_NOTES.md --prerelease
